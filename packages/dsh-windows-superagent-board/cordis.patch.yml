# Bundle layer: DSH applies this insert row when the package is mounted as a profile bundle
# (dsh.bundle.patch in package.json). A profile may add the same row by hand instead; that is
# how the 0.2.6 tarball must be mounted, because that release declares no dsh.bundle.
- insert:
    - id: superagent-board
      name: 'dsh-windows-superagent-board'